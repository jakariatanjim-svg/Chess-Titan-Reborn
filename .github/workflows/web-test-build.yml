# Builds the static website and uploads a downloadable artifact only.
# It does not create tags/releases, publish assets to a release, or deploy to Cloudflare Pages.
name: Web — Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build downloadable website artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests when configured
        run: npm test --if-present

      - name: Calculate the next version label
        id: artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          function parseVersion(tag) {
            const match = /^v(0|[1-9][0-9]*)\.([0-9])(?:\.([0-9]))?$/.exec(tag ?? '');
            if (!match) return null;
            return { parts: match[3] === undefined
              ? [Number(match[1]), Number(match[2])]
              : [Number(match[1]), Number(match[2]), Number(match[3])] };
          }

          function compareVersions(left, right) {
            const length = Math.max(left.parts.length, right.parts.length);
            for (let index = 0; index < length; index += 1) {
              const difference = (left.parts[index] ?? 0) - (right.parts[index] ?? 0);
              if (difference !== 0) return difference;
            }
            return 0;
          }

          function increment(version) {
            const parts = [...version.parts];
            if (parts.length === 2) {
              if (parts[1] < 9) parts[1] += 1;
              else { parts[0] += 1; parts[1] = 0; }
            } else if (parts[2] < 9) {
              parts[2] += 1;
            } else if (parts[1] < 9) {
              parts[1] += 1;
              parts[2] = 0;
            } else {
              parts[0] += 1;
              parts[1] = 0;
              parts[2] = 0;
            }
            return { parts };
          }

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          let latestRelease = null;
          const response = await fetch(`https://api.github.com/repos/${repository}/releases/latest`, {
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (response.ok) {
            const release = await response.json();
            latestRelease = parseVersion(release.tag_name);
          } else if (response.status !== 404) {
            throw new Error(`Could not read the latest release (${response.status}).`);
          }

          const tags = execFileSync('git', ['tag', '--list'], { encoding: 'utf8' })
            .split('\n')
            .map(parseVersion)
            .filter(Boolean);
          const highestTag = tags.reduce((highest, item) =>
            !highest || compareVersions(item, highest) > 0 ? item : highest, null);
          let next = latestRelease
            ? increment(latestRelease)
            : highestTag
              ? increment(highestTag)
              : { parts: [1, 0] };

          // A test label never creates a tag; advance past every valid tag so the label stays unused.
          while (tags.some((item) => compareVersions(next, item) <= 0)) next = increment(next);

          const version = next.parts.join('.');
          const branch = process.env.GITHUB_REF_NAME.replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '') || 'branch';
          const shortSha = process.env.GITHUB_SHA.slice(0, 7);
          const repoName = repository.split('/').at(-1);
          const artifactName = `${repoName}-${branch}-${shortSha}-v${version}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nartifact_name=${artifactName}\n`);
          console.log(`Artifact label: v${version}`);
          console.log(`Artifact name: ${artifactName}`);
          NODE

      - name: Build static site
        run: npm run build

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Explain build failure
        if: failure()
        run: echo "::error::The Web artifact did not finish. Review the failed step, fix its reported issue, then manually rerun Web — Test Build."

      - name: Write run summary
        if: always()
        env:
          VERSION_LABEL: ${{ steps.artifact.outputs.version }}
        run: |
          version="${VERSION_LABEL:-unavailable}"
          {
            echo '| Branch | Version label | Tag | Release link |'
            echo '|---|---|---|---|'
            echo "| ${GITHUB_REF_NAME} | v${version} | Not created | Artifact only; no release |"
          } >> "$GITHUB_STEP_SUMMARY"
